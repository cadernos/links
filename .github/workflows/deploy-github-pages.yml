name: Publicar site e protocolo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar site estatico
        run: python scripts/build_public.py
      - name: Conferir os arquivos do site e do protocolo
        run: |
          test -s public/index.html
          test -s public/protocolo/index.html
          grep -q 'Encontre a próxima ação' public/protocolo/index.html
          test -s public/protocolo/situacoes/index.html
          test -s public/protocolo/projetos/index.html
          test -s public/protocolo/normas/1/index.html
          test -s public/protocolo/style.css
          test -s public/protocolo/site.js
          grep -q 'id="situacoes"' public/protocolo/situacoes/index.html
          grep -q 'id="gpt-desk"' public/protocolo/projetos/index.html
          grep -q 'id="s1"' public/protocolo/normas/1/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carregar artefato publico
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Testar o protocolo no endereco publico
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          TARGET="${SITE_URL%/}/protocolo/"
          echo "Verificando URL publica: ${TARGET}"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-protocolo.html "${TARGET}"
          grep -q 'Encontre a próxima ação' /tmp/cadlin-protocolo.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-situacoes.html "${TARGET}situacoes/"
          grep -q 'id="situacoes"' /tmp/cadlin-situacoes.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-projetos.html "${TARGET}projetos/"
          grep -q 'id="gpt-desk"' /tmp/cadlin-projetos.html
          echo "Verificacao publica concluida com sucesso"
