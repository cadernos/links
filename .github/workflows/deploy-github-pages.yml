name: Publicar site e protocolo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar site estatico
        run: python scripts/build_public.py
      - name: Conferir os arquivos do site e do protocolo
        run: |
          test -s public/index.html
          test -s public/protocolo/index.html
          grep -q 'Selecione seu perfil' public/protocolo/index.html
          test -s public/protocolo/situacoes/index.html
          test -s public/protocolo/projetos/index.html
          test -s public/protocolo/normas/1/index.html
          test -s public/protocolo/style.css
          test -s public/protocolo/site.js
          test -s public/protocolo/style-v23.css
          test -s public/protocolo/style-v25.css
          grep -Fq 'style-v25.css' public/protocolo/index.html
          test -s public/protocolo/site-v23.js
          test -s public/protocolo/search-index-v23.js
          test -s public/protocolo/design-v26.css
          test -s public/protocolo/site-v26.js
          test -s public/protocolo/search-v26.js
          grep -Fq 'design-v26.css' public/protocolo/index.html
          for page in roteiro situacoes app projetos prazos ajuda normas normas/1 normas/2 normas/3 normas/4 normas/5 normas/6 normas/7 normas/8 normas/completo; do
            test -s "public/protocolo/${page}/index.html"
            grep -Fq 'design-v26.css' "public/protocolo/${page}/index.html"
          done
          grep -Fq 'style-v23.css' public/protocolo/index.html
          grep -Fq '<ul class="home-situation-list"' public/protocolo/index.html
          grep -q 'id="situacoes"' public/protocolo/situacoes/index.html
          grep -q 'id="gpt-desk"' public/protocolo/projetos/index.html
          grep -q 'id="s1"' public/protocolo/normas/1/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carregar artefato publico
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Testar o protocolo no endereco publico
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          TARGET="${SITE_URL%/}/protocolo/"
          echo "Verificando URL publica: ${TARGET}"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-protocolo.html "${TARGET}"
          grep -q 'Selecione seu perfil' /tmp/cadlin-protocolo.html
          grep -Fq 'style-v23.css' /tmp/cadlin-protocolo.html
          grep -Fq 'style-v25.css' /tmp/cadlin-protocolo.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-style-v23.css "${TARGET}style-v23.css"
          grep -Fq '.home-situation-list>li>a' /tmp/cadlin-style-v23.css
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-design-v26.css "${TARGET}design-v26.css"
          grep -Fq -- '--type-page' /tmp/cadlin-design-v26.css
          grep -Fq 'design-v26.css' /tmp/cadlin-protocolo.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-norma-2.html "${TARGET}normas/2/"
          grep -Fq 'normative-page-title' /tmp/cadlin-norma-2.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-situacoes.html "${TARGET}situacoes/"
          grep -q 'id="situacoes"' /tmp/cadlin-situacoes.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --retry-all-errors --output /tmp/cadlin-projetos.html "${TARGET}projetos/"
          grep -q 'id="gpt-desk"' /tmp/cadlin-projetos.html
          echo "Verificacao publica concluida com sucesso"
